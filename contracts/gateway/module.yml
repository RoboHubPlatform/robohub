#
# robohub-contract-gateway — the gateway contract.
#
# The interface an application calls and the manager that dispatches it to the
# provider the application names. It is versioned on its own, and reaches its
# providers by module name, so it builds wherever its dependencies resolve.
#
module:
  name: robohub-contract-gateway
  id: robohub.contract.gateway
  type: module
  version: 0.2.1
  description: >
    The gateway functions an application calls for projects, sources, states and readings, dispatched to the provider it names.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-12"

main: manager.rho

deps:
  rho-log: ">=0.1.2"
  robohub:
    robohub-provider-mesh: ">=0.1.0"
