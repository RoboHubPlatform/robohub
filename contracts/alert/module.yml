#
# robohub-alert — the alert interface.
#
# What an alert channel can do, and how an application's alerts reach the
# channels it binds. The channels are providers (robohub-provider-log, -email,
# -telegram, -webhook); an application declares the ones it uses and binds them:
#
#   bind:
#     robohub.alert:
#       providers: [robohub-provider-log, robohub-provider-telegram]
#       config:
#         robohub-provider-log:
#           path: ~/.rho/myapp/alerts.log
#
# Only the bound providers are compiled into the application.
#
module:
  name: robohub-alert
  id: robohub.interface.alert
  previous_ids:
    - robohub.contract.alert
  type: module
  version: 1.1.0
  description: >
    The alert interface: an application raises an alert, and every enabled
    channel it binds whose severity threshold the alert meets delivers it.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-12"

main: src/alert.rho

provides:
  import: robohub.alert
  exports:
    - raise
    - test
    - providers
    - enabled
    - config
    - configure
    - alert_rule_new
    - alert_rule_evaluate
    - alert_rule_violating
    - alert_rule_cleared
    - alert_rule_message
    - alert_rule_trigger
    - AlertRule
    - AlertEvaluation

# What every channel implements.
interface:
  functions:
    send: "(level: string, message: string, metadata: string) u32"
