#
# ui — the RoboHub look, shared by every RoboHub application.
#
# The colours, type and components as one stylesheet with a dark and a light
# theme from the same tokens, the top bar every application draws (brand, app
# switcher, the person and their theme), and the few lines of script every page
# needs. An application includes it and serves the same look as the others.
#
module:
  name: ui
  id: robohub.module.ui
  type: module
  title: RoboHub UI
  category: ui
  version: 0.2.0
  description: >
    The RoboHub look: design tokens for a dark and a light theme, the shared
    components and the top bar with the app switcher, for every RoboHub
    application.
  maintainer: "Aurel Miron"
  author: "Aurel Miron"
  license: "MIT"
  created: "2026-11-13"

main: src/main.rho

# What other code may use, and by what name: `import robohub.ui`. An
# application that includes the module reaches everything in it, and a build
# says when it calls a function not listed here.
provides:
  import: robohub.ui
  exports:
    - ui_head
    - ui_theme
    - ui_state_word
    - ui_person
    - ui_topbar_in
    - ui_language
    - ui_topbar_remote_in

docs:
  title: RoboHub UI
  section: modules
  order: "36"
  index: docs/index.md
  sources:
    - docs/index.md

# Read at run time by name (rho_asset), embedded into every application that
# includes the module.
assets:
  - static

# The words the bar writes itself, in the languages the applications offer.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
