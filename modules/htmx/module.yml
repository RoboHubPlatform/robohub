#
# htmx — vendored HTMX and its SSE extension.
#
# The files are served by the host under /assets/, so an application never
# depends on a CDN or a JavaScript build toolchain.
#
module:
  name: htmx
  id: robohub.module.htmx
  previous_ids:
    - robohub.modules.htmx
  type: module
  title: HTMX
  category: ui
  version: 0.2.0
  description: >
    A pinned copy of HTMX and its Server-Sent Events extension, served from the
    host, with the small helpers a Rho page uses to answer fragments and
    redirects.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-08"

main: src/main.rho

# What other code may use, and by what name: `import robohub.htmx`. Everything else
# in this module is its own.
provides:
  import: robohub.htmx
  exports:
    - htmx_head
    - htmx_is_request
    - htmx_redirect
    - htmx_trigger


docs:
  title: HTMX
  section: modules
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - assets
