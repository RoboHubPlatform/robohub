#
# logging — the logging settings every application shares.
#
# One module owns the level, format, file, rotation and stderr policy. The
# application's settings page calls this module, the host's logemit port writes
# the records, and included modules inherit the same configuration.
#
module:
  name: logging
  id: robohub.module.logging
  previous_ids:
    - robohub.modules.logging
  type: module
  version: 0.2.1
  title: Logging
  description: >
    Per-application logging policy: level, text or JSON, a rotating file under
    the user state directory, and whether records also go to standard error.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-09"

main: src/main.rho

# What other code may use, and by what name: `import robohub.logging`. Everything else
# in this module is its own.
provides:
  import: robohub.logging
  exports:
    - log_config_apply
    - log_settings_form
    - log_settings_save
    - log_file_in_settings_file

deps:
  rho-log: ">=0.1.2"
  robohub:
    settings: ">=0.1.0"
    forms: ">=0.1.0"

docs:
  title: Logging
  section: modules
  order: "46"
  index: docs/index.md
  sources:
    - docs/index.md
