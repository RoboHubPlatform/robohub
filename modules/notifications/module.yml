#
# notifications — transient toast notifications for a host application.
#
# A notification is a short message (info, warning, error) that appears on the
# page, stays for a given number of seconds, and then disappears.  The host
# application owns the route, the SQL database and the workspace; the module
# owns the definitions and the rendering.
#
module:
  name: notifications
  type: module
  title: Notifications
  category: ui
  version: 0.1.2
  description: >
    Transient toast notifications with severity levels (info, warning, error)
    that auto-dismiss after a configurable timeout.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-06"

main: src/main.rho


deps:
  rho-log: ">=0.1.0"

docs:
  title: Notifications
  section: modules
  order: "35"
  index: docs/index.md
  sources:
    - docs/index.md
