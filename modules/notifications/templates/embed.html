<style>.toast{position:fixed;left:50%;top:4.6rem;transform:translateX(-50%) translateY(-200%);z-index:2147483647;padding:.6rem 1.1rem;border-radius:10px;background:rgba(15,20,21,.96);border:1px solid #e4b866;color:#f4efe4;font-size:.88rem;opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none;max-width:80vw;box-shadow:0 8px 24px rgba(0,0,0,.5)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{border-color:#79c7bd;color:#79c7bd}.toast.err{border-color:#f0a06a;color:#f0a06a}.toast.warn{border-color:#e4b866;color:#e4b866}</style>
<div id="toast" class="toast" data-url="/notifications/stream" data-keeper-port="{keeper_port}"></div>
<script>(function(){var t=document.getElementById("toast");var lang=document.documentElement.lang||"en";var words={en:{done:"Done.",updated:"Updated."},ro:{done:"Gata.",updated:"Actualizat."}};var w=words[lang]||words.en;window.rhoToast=function(m,k,s){t.textContent=m||w.done;t.className="toast show"+(k?" "+k:"");clearTimeout(window.rhoToast._t);var n=Number(s);window.rhoToast._t=setTimeout(function(){t.className="toast";},(n>0?n:5)*1000);};var hear=function(ev){var d={};try{d=JSON.parse(ev.data||"{}");}catch(e){}if(d.locale&&d.locale!==lang){return;}window.rhoToast(d.message||w.updated,d.kind||"info",d.timeout);window.dispatchEvent(new CustomEvent("rho:event",{detail:d}));};try{var es=new EventSource(t.getAttribute("data-url"));es.onmessage=hear;}catch(e){}var kp=t.getAttribute("data-keeper-port");if(/^[0-9]+$/.test(kp||"")&&kp!==location.port){try{var ks=new EventSource(location.protocol+"//"+location.hostname+":"+kp+"/api/v1/notifications/stream",{withCredentials:true});ks.onmessage=hear;}catch(e){}}})();</script>
