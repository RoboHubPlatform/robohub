<style>.toast{position:fixed;left:50%;top:4.6rem;transform:translateX(-50%) translateY(-200%);z-index:2147483647;padding:.6rem 1.1rem;border-radius:10px;background:rgba(15,20,21,.96);border:1px solid #e4b866;color:#f4efe4;font-size:.88rem;opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none;max-width:80vw;box-shadow:0 8px 24px rgba(0,0,0,.5)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{border-color:#79c7bd;color:#79c7bd}.toast.err{border-color:#f0a06a;color:#f0a06a}</style>
<div id="toast" class="toast"></div>
<script>(function(){var t=document.getElementById("toast");window.rhoToast=function(m,k){t.textContent=m||"Done.";t.className="toast show"+(k?" "+k:"");clearTimeout(window.rhoToast._t);window.rhoToast._t=setTimeout(function(){t.className="toast";},4000);};try{var es=new EventSource("/notifications/stream");es.onmessage=function(ev){var d={};try{d=JSON.parse(ev.data||"{}");}catch(e){}window.rhoToast(d.message||"Updated.",d.kind||"info");window.dispatchEvent(new CustomEvent("rho:event",{detail:d}));};}catch(e){}})();</script>
