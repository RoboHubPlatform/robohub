#
# widgets — configurable dashboard widgets for a host application.
#
# A widget shows a number, a history chart, or a push button that calls a
# configured hook. The host application owns the route, the SQL database and
# the workspace; the module owns the definitions and the rendering.
#
module:
  name: widgets
  id: robohub.module.widgets
  previous_ids:
    - robohub.modules.widgets
  type: module
  title: Widgets
  category: dashboard
  version: 0.3.5
  description: >
    Dashboard widgets with a configurable source: a number, a chart of recent
    values, or a button that calls a hook or API.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/main.rho

# The module's tables and statements, its own: rho-sql (0.2) generates them into
# every application that depends on the module, so an application never repeats
# them.
sql:
  schema: db/schema.sql
  queries: db/queries.sql


deps:
  rho-log: ">=0.1.0"
  robohub:
    # Its pages are translated (i18n_t, i18n_vars).
    i18n: ">=0.4.0"
    settings: ">=0.1.0"
    notifications: ">=0.1.0"
    forms: ">=0.1.0"
    robohub-gateway: ">=1.1.0"
    # A widget reads an inventory item by handle, an application value
    # (appapi) and writes presses to the journal.
    inventory: ">=0.2.0"
    journal: ">=0.1.0"
    appapi: ">=0.1.0"

docs:
  title: Widgets
  section: modules
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - templates
  - db/schema.sql
  - docs/index.md

# Its translations, merged into every application that includes it.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
