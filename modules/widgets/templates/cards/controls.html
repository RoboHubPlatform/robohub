{{#if pinnable}}<div class="wctl-pin"><form method="post" action="/widgets/pin" style="display:inline" hx-post="/widgets/pin" hx-target="#widget-{{ id }}" hx-swap="outerHTML"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="pinned" value="{{ pin_value }}"><button type="submit" class="icon-btn" title="{{#if pinned}}{{t "widget.unpin"}}{{else}}{{t "widget.pin"}}{{/if}}">{{ pin_icon }}</button></form></div>{{/if}}<div class="wctl-size"><form method="post" action="/widgets/resize" style="display:inline" hx-post="/widgets/resize" hx-target="#widget-{{ id }}" hx-swap="outerHTML"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="delta" value="dec"><button type="submit" class="icon-btn" title="{{t "widget.smaller"}}">−</button></form><form method="post" action="/widgets/resize" style="display:inline" hx-post="/widgets/resize" hx-target="#widget-{{ id }}" hx-swap="outerHTML"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="delta" value="inc"><button type="submit" class="icon-btn" title="{{t "widget.larger"}}">+</button></form></div><div class="wctl-move"><form method="post" action="/widgets/move" style="display:inline"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="delta" value="-1"><button type="submit" class="icon-btn" title="{{t "widget.move_left"}}">←</button></form><form method="post" action="/widgets/move" style="display:inline"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="delta" value="1"><button type="submit" class="icon-btn" title="{{t "widget.move_right"}}">→</button></form></div>
