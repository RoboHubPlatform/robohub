<tr>
  <td><strong>{{{ title }}}</strong></td>
  <td>{{{ kind }}}</td>
  <td><small>{{{ source }}}</small></td>
  <td>{{{ latest }}}</td>
  <td>
    <div class="widget-actions">
      <a href="/widgets/edit?id={{{ id }}}">Edit</a>
      <form method="post" action="/widgets/value">
        <input type="hidden" name="id" value="{{{ id }}}">
        <input name="value" placeholder="value">
        <button type="submit" class="quiet">Add value</button>
      </form>
      <form method="post" action="/widgets/press">
        <input type="hidden" name="id" value="{{{ id }}}">
        <input type="hidden" name="return" value="widgets">
        <button type="submit" class="quiet">Press</button>
      </form>
      <form method="post" action="/widgets/delete" onsubmit="return confirm('Remove this widget?');">
        <input type="hidden" name="id" value="{{{ id }}}">
        <button type="submit" class="danger">Delete</button>
      </form>
    </div>
  </td>
</tr>
