<h1>Widgets</h1>
<p>Numbers, charts and switches for the application's home page. A widget reads
a manual value, a URL that returns a plain number, or a hook called by a button
or switch.</p>
{{{ notice }}}

<h2>Add a widget</h2>
<form class="panel-form" method="post" action="/widgets/add">
  <div class="grid">
    <label>Title<input name="title" required placeholder="Water temperature"></label>
    <label>Kind
      <select name="kind">
        <option value="numeric">Number</option>
        <option value="chart">Chart</option>
        <option value="button">Button</option>
        <option value="toggle">Switch</option>
      </select>
    </label>
    <label>Source
      <select name="source_kind">
        <option value="manual">Manual</option>
        <option value="url">URL / hook</option>
      </select>
    </label>
    <label>URL or hook<input name="source" placeholder="http://host/api or hook?state={state}"></label>
    <label>Method<select name="method"><option>GET</option><option>POST</option></select></label>
    <label>Unit<input name="unit" placeholder="°C"></label>
    <label>Chart points<input name="points" value="24" inputmode="numeric"></label>
  </div>
  <div class="form-actions"><button type="submit">Add widget</button></div>
</form>

<h2>Preview</h2>
{{{ preview }}}

<h2>All widgets</h2>
<table>
<thead><tr><th>Title</th><th>Kind</th><th>Source</th><th>Latest</th><th></th></tr></thead>
<tbody>
{{{ rows }}}
</tbody>
</table>
