#
# settings — the host-owned runtime settings store.
#
# A module asks for a namespaced key; the parent application owns the file and
# decides where it lives. A standalone module falls back to the RoboHub home.
#
module:
  name: settings
  id: robohub.module.settings
  previous_ids:
    - robohub.modules.settings
  type: module
  title: Settings
  category: core
  version: 0.2.2
  description: >
    A small key-value store for runtime settings owned by the host application,
    with namespaced keys and a plain key=value file.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-08"

main: src/main.rho

# What other code may use, and by what name: `import robohub.settings`. Everything else
# in this module is its own.
provides:
  import: robohub.settings
  exports:
    - settings_get
    - settings_set
    - settings_list

docs:
  title: Settings store
  section: modules
  order: "32"
  index: docs/index.md
  sources:
    - docs/index.md
