<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · RoboHub Aquarium</title>
<style>
  :root { --ink:#f4efe4; --muted:#c7c0b2; --faint:#a9a294; --gold:#e4b866; --teal:#79c7bd; --warn:#f0a06a; --panel:rgba(18,24,25,.68); --line:rgba(244,239,228,.18); }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.5;
    background:linear-gradient(180deg,rgba(5,11,15,.58),rgba(5,13,17,.30) 38%,rgba(4,10,13,.76)),url("/static/aquarium-background.jpg") center/cover fixed no-repeat,radial-gradient(1200px 700px at 50% 10%,#2d5c63,#0a1418 70%); }
  a { color:var(--gold); text-decoration:none; } a:hover { color:#f3d59a; }
  .topbar,.bottombar { position:fixed; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem 1.6rem; background:linear-gradient(180deg,rgba(7,14,17,.84),rgba(7,14,17,.54)); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .topbar { top:0; } .bottombar { bottom:0; border-top:1px solid var(--line); border-bottom:0; font-size:.78rem; color:var(--muted); }
  .brand { font-family:"Palatino Linotype",Georgia,serif; font-size:1.05rem; } .brand em { color:var(--teal); font-style:normal; }
  nav { display:flex; gap:1rem; font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; } nav a { color:var(--muted); } nav a.active,nav a:hover { color:var(--gold); }
  .bottombar nav a { text-transform:none; letter-spacing:0; }
  main { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:6rem 1.6rem 6rem; }
  h1 { font-family:"Palatino Linotype",Georgia,serif; font-weight:500; font-size:clamp(1.9rem,4vw,2.7rem); margin:0 0 .3rem; }
  h2 { font-family:"Palatino Linotype",Georgia,serif; font-weight:500; font-size:1.25rem; margin:1.8rem 0 .5rem; }
  p { color:var(--muted); margin:.3rem 0 .9rem; max-width:68ch; } small { color:var(--faint); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:.85rem; }
  th,td { padding:.5rem .6rem; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:rgba(10,18,20,.55); color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.7rem; }
  label { display:flex; flex-direction:column; gap:.2rem; font-size:.78rem; color:var(--muted); }
  input,select { font:inherit; padding:.44rem .5rem; border:1px solid var(--line); border-radius:6px; background:rgba(10,16,18,.62); color:var(--ink); }
  button { font:inherit; padding:.46rem .85rem; border:1px solid var(--gold); border-radius:6px; background:var(--gold); color:#1a1308; cursor:pointer; font-weight:700; }
  button.quiet { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:transparent; color:var(--warn); border-color:var(--warn); }
  .form-actions { margin-top:.85rem; }
  .panel-form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; backdrop-filter: blur(10px); }
  .notice { padding:.55rem .75rem; border:1px solid var(--teal); border-radius:8px; background:rgba(121,199,189,.14); color:var(--teal); }
  .badge { display:inline-block; padding:.06rem .45rem; border-radius:999px; font-size:.65rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:rgba(255,255,255,.08); color:var(--muted); }
  .badge.due { background:rgba(228,184,102,.18); color:var(--gold); }
  .badge.overdue { background:rgba(240,160,106,.2); color:var(--warn); }
  .badge.done { background:rgba(121,199,189,.16); color:var(--teal); }
  .badge.pending { background:rgba(255,255,255,.08); color:var(--muted); }
  .chore-actions { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; }
  .chore-actions form { display:inline-flex; gap:.3rem; align-items:center; margin:0; }
  .chore-actions input { padding:.25rem .4rem; font-size:.76rem; }
  .chore-actions button { padding:.25rem .5rem; font-size:.72rem; }
  .keeper[data-keeper-port] { color:var(--teal); }
  .tabs { display: flex; gap: 1rem; align-items: stretch; margin-top: 1.2rem; }
  .vtabnav { flex: 0 0 178px; display: flex; flex-direction: column; gap: .3rem; padding: .6rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px); position: sticky; top: 5.2rem; align-self: flex-start; }
  .vtabnav a { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .5rem .65rem; border-radius: 8px; color: var(--muted); font-size: .82rem; letter-spacing: .03em; }
  .vtabnav a b { font-weight: 600; }
  .vtabnav a:hover { color: var(--gold); }
  .vtabnav a.active { background: var(--gold); color: #1a1308; }
  .tabpanels { flex: 1 1 auto; min-width: 0; }
  .tab { display: none; }
  .tab.active { display: block; }
  .tab > .panel-form { margin-top: 1rem; }
  .docs { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .78rem; background: rgba(15,20,21,.55); border: 1px solid var(--line); border-radius: 8px; padding: .8rem; max-height: none; overflow: visible; backdrop-filter: blur(6px); }
  .tabs.horizontal { flex-direction: column; }
  .tabs.horizontal .vtabnav { flex-direction: row; flex: none; position: static; }
  .tabs.horizontal .vtabnav a { flex: 1 1 auto; justify-content: center; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">RoboHub <em>Aquarium</em> · Scheduler</div>
  <nav>
    <a href="/">Home</a>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/widgets">Widgets</a>
    <a href="/equipment">Equipment</a>
    <a href="/automation">Automation</a>
    <a href="/chemistry">Chemistry</a>
    <a href="/modes">Modes</a>
    <a href="/events">Events</a>
    <a href="/settings">Settings</a>
    {{{ keeper }}}
  </nav>
</header>
<main>{{{ body }}}</main>
<footer class="bottombar">
  <span id="status-inventory">Items: —</span>
  <span id="status-scheduler">Tasks: —</span>
  <span id="status-widgets"></span>
  <nav>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/widgets">Widgets</a>
    <a href="/docs">Documentation</a>
    {{{ keeper }}}
  </nav>
</footer>
<script>
(function () {
  document.querySelectorAll(".keeper[data-keeper-port]").forEach(function (el) {
    var port = el.getAttribute("data-keeper-port");
    if (port) { el.href = location.protocol + "//" + location.hostname + ":" + port + "/"; }
  });
})();
</script>
</body>
</html>
