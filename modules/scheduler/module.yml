#
# scheduler — a reusable module for recurring chores and one-off tasks.
#
# The module has no port and no database of its own. A host application
# includes it, declares its route and points its SQL block at this module's
# schema; the records live in the host application's workspace.
#
module:
  name: scheduler
  id: robohub.module.scheduler
  previous_ids:
    - robohub.modules.scheduler
  type: module
  title: Scheduler
  category: maintenance
  version: 0.3.0
  description: >
    A chore scheduler for maintenance tasks: interval, cron, one-time and
    usage-based schedules, due and overdue states, completion notes and
    snoozing.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/main.rho

# What other code may use, and by what name: `import robohub.scheduler`. An
# application that includes the module reaches everything in it, and a build
# says when it calls a function not listed here.
provides:
  import: robohub.scheduler
  exports:
    - scheduler_status
    - scheduler_links_text
    - scheduler_usage_tick
    - scheduler_presets
    - scheduler_complete_title
    - scheduler_settings_form
    - scheduler_settings_save

# The module's tables and statements, its own: rho-sql (0.2) generates them into
# every application that depends on the module, so an application never repeats
# them.
sql:
  schema: db/schema.sql
  queries: db/queries.sql


deps:
  rho-log: ">=0.1.0"
  robohub:
    # Its pages are translated (i18n_t, i18n_vars).
    i18n: ">=0.4.0"
    settings: ">=0.1.0"
    notifications: ">=0.1.0"
    forms: ">=0.1.0"
    inventory: ">=0.2.0"

docs:
  title: Scheduler
  section: modules
  order: "20"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - templates
  - db/schema.sql
  - docs/index.md

# Its translations, merged into every application that includes it.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
