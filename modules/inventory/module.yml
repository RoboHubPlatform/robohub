#
# inventory — a reusable module for stock and what it costs.
#
# It is a module a host application includes. The host owns the HTTP port and
# the router; the module registers its routes there and keeps its records in the
# host application's workspace. The module registry in modules/registry.yml is
# how the keeper knows it is installed.
#
module:
  name: inventory
  id: robohub.module.inventory
  previous_ids:
    - robohub.modules.inventory
  type: module
  title: Inventory & expenses
  category: inventory
  version: 0.2.1
  description: >
    Everything an installation has, in one place: consumables, parts and the
    equipment itself, in the categories the application defines; stock, reorder
    levels, purchases and prices; and, for equipment, which gateway sources its
    capabilities are bound to, so it can be read, switched and its runtime
    counted by its handle rather than by the device it is plugged into.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/main.rho

# The module's tables and statements. They are its own: rho-sql (0.2) generates
# them into every application that depends on the module, before the
# application's own, so an application never repeats them.
sql:
  schema: db/schema.sql
  queries: db/queries.sql

# What the keeper's Modules page reads. A module is a full application
# — backend, pages and storage — but it owns no port and no instance settings:
# the application that includes it declares the route, the database and the
# workspace in its own module.yml.

deps:
  rho-log: ">=0.1.0"
  robohub:
    settings: ">=0.1.0"
    notifications: ">=0.1.0"
    forms: ">=0.1.0"
    # The interface only, never a provider: an application that binds a
    # gateway can connect equipment to devices, and one that binds none still
    # has an inventory.
    robohub-gateway: ">=1.1.0"

docs:
  title: Inventory & expenses
  section: modules
  order: "10"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - templates
  - db/schema.sql
  - docs/index.md

# Its translations, merged into every application that includes it.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
