#
# forms — a schema-driven form engine for a host application.
#
# A form is data, not code: a module declares the fields (name, kind, label,
# validation) and this engine renders the controls, tracks the current values,
# reports the errors and hands the collected payload back. One engine, every
# form; the styling, the error handling and the input controls are maintained
# in one place rather than copied into every page.
#
module:
  name: forms
  id: robohub.module.forms
  previous_ids:
    - robohub.modules.forms
  type: module
  title: Forms
  category: forms
  version: 0.3.5
  description: >
    A schema-driven form engine: a module declares its fields as data and the
    engine renders the controls, validates the input and emits the payload.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-06"

main: src/main.rho

# What other code may use, and by what name: `import robohub.forms`. Everything else
# in this module is its own.
provides:
  import: robohub.forms
  exports:
    - forms_open
    - forms_parse
    - forms_read
    - forms_validate
    - forms_value
    - forms_payload
    - forms_csrf_field
    - forms_csrf_ok
    - forms_style
    - forms_body
    - FormField


docs:
  title: Forms
  section: modules
  order: "40"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - templates

# Its translations, merged into every application that includes it.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
