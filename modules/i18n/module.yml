#
# i18n — locale negotiation and a language switcher for Rho hosts.
#
# Catalogs are flat JSON files embedded by the host's build. This module owns
# the request-side choice of language, the cookie, and the switcher partial.
#
module:
  name: i18n
  id: robohub.module.i18n
  previous_ids:
    - robohub.modules.i18n
  type: module
  title: Internationalisation
  category: ui
  version: 0.4.4
  description: >
    Locale negotiation from a cookie or Accept-Language, a language switcher,
    and the helper that carries the active locale into a Rho template.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-08"

main: src/main.rho

# The language switcher reads its form through the form engine.
deps:
  robohub:
    forms: ">=0.3.0"

# What other code may use, and by what name: `import robohub.i18n`. Everything else
# in this module is its own.
provides:
  import: robohub.i18n
  exports:
    - i18n_t
    - i18n_vars
    - i18n_locale
    - i18n_switcher
    - i18n_phrases
    - i18n_safe_next

docs:
  title: Internationalisation
  section: modules
  order: "31"
  index: docs/index.md
  sources:
    - docs/index.md

# What this module reads at run time by name (rho_asset), embedded into every
# application that includes it, so it never reads its own folder.
assets:
  - templates

# Its translations, merged into every application that includes it.
locales:
  - locale: en
    file: locales/en.json
  - locale: ro
    file: locales/ro.json
