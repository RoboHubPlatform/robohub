# The application module registry database.
#
# A module is a reusable Rho application with a backend, pages and its own
# storage. This file is the installed set the keeper's Modules page reads;
# each path is confirmed on disk before a row is shown. Install and uninstall
# edit this file, so a module added from the dashboard is available without a
# rebuild.
modules:
  - name: inventory
    path: inventory
    enabled: true
  - name: scheduler
    path: scheduler
    enabled: true
  - name: widgets
    path: widgets
    enabled: true
  - name: journal
    path: journal
    enabled: true
  - name: rules
    path: rules
    enabled: true
  - name: appapi
    path: appapi
    enabled: true
  - name: simulator
    path: simulator
    enabled: true
  - name: appshell
    path: appshell
    enabled: true
  - name: forms
    path: forms
    enabled: true
  - name: htmx
    path: htmx
    enabled: true
  - name: i18n
    path: i18n
    enabled: true
  - name: logging
    path: logging
    enabled: true
  - name: notifications
    path: notifications
    enabled: true
  - name: settings
    path: settings
    enabled: true
  - name: ui
    path: ui
    enabled: true
