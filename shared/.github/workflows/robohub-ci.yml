# The workflow every repository in the RoboHub ecosystem runs.
#
# One workflow, called by each repository, rather than one workflow written
# thirteen times: the steps are the same, and a copy of a step is a step that
# is fixed in one repository and not the others.
#
# A repository calls it from its own workflow:
#
#   jobs:
#     ci:
#       uses: RoboHubPlatform/robohub/.github/workflows/robohub-ci.yml@main
#       with:
#         module: robohub-avr
#         target: uno-r3
#
name: CI

on:
  workflow_call:
    inputs:
      module:
        description: The module to build and test.
        required: true
        type: string
      target:
        description: The board the module is built for, when it is one.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The toolchain. A platform is not built by cmake: it is built by rho,
      # for a board, from an application — a board cannot be compiled on its
      # own and neither can the platform, because a driver is compiled against
      # a part's headers and a board's. Its host tests are run by `rho test`.
      - name: Check out the toolchain
        uses: actions/checkout@v5
        with:
          repository: RoboHubPlatform/rho
          path: toolchain

      - name: Install the toolchain
        # check.sh builds the toolchain and publishes the modules named into the
        # local registry: the test runner and the plugins `rho test` needs here.
        run: |
          cd toolchain
          ./scripts/check.sh publish rho-test rho-test-ctest rho-test-junit
          echo "$HOME/.rho/bin" >> "$GITHUB_PATH"

      # A path under someone's home is true for one machine and published to all:
      # a manifest names a sibling by ${ROBOHUB_WORKSPACE}.
      - name: No local paths
        run: toolchain/scripts/check-local-paths.sh .

      # A module's id is what registries, lock files and saved plans refer to it by,
      # so two modules with one id, or an id that is another's previous id, cannot
      # both be true.
      - name: Module ids
        run: rho module ids .

      # The module's tests are declared in its tests/tests.yml, and `rho test` runs
      # them: the ctest kind configures with the host tests switched on, builds,
      # runs, and fails a run that found none. Nothing here calls cmake or ctest.
      - name: Test
        run: rho test .
