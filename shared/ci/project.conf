# The configuration a CI build resolves.
#
# A CI build has to say what is switched on, and what it says is a fact about
# the build rather than about the module: the same lines are resolved for every
# module of the ecosystem, so they are written once and copied rather than
# written thirteen times and drifted.
#
# The names are the module's own — a platform's HAL is its own, and a common
# module's is the common one — so a repository that uses this file adjusts the
# names and says so.
CONFIG_RH_HAL_GPIO=y
CONFIG_RH_HAL_I2C=n
CONFIG_RH_HAL_SPI=y
CONFIG_RH_HAL_UART=n
CONFIG_RH_HAL_RS485=n
CONFIG_RH_HAL_TIMER=y
