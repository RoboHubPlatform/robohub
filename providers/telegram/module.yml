#
# robohub-provider-telegram — the Telegram transport.
#
module:
  name: robohub-provider-telegram
  id: robohub.provider.telegram
  previous_ids:
    - robohub.providers.telegram
  type: provider
  version: 0.2.2
  description: Posts an alert to a Telegram chat through the bot API.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/provider.rho

# It implements the alert interface: an application that binds it receives
# its alerts through it, and reads its settings from the binding.
implements: [robohub.alert]

provides:
  import: robohub.alert_telegram
  exports: [send]
  settings:
    - bot_token
    - chat_id
    - severity_threshold


metadata:
  tags:
    - provider
    - alert
    - telegram

docs:
  title: robohub-provider-telegram
  section: providers
  order: "30"
  index: README.md
  sources:
    - README.md
