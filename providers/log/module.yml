#
# robohub-provider-log — the local log transport.
#
# A provider of the alert interface (robohub-alert). An application selects it
# in its binding.
#
module:
  name: robohub-provider-log
  id: robohub.provider.log
  previous_ids:
    - robohub.providers.log
  type: provider
  version: 0.2.2
  description: Appends an alert line to a file on the machine.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/provider.rho

# It implements the alert interface: an application that binds it receives
# its alerts through it, and reads its settings from the binding.
implements: [robohub.alert]

provides:
  import: robohub.alert_log
  exports: [send]
  settings:
    - path
    - severity_threshold


metadata:
  tags:
    - provider
    - alert
    - log

docs:
  title: robohub-provider-log
  section: providers
  order: "10"
  index: README.md
  sources:
    - README.md
