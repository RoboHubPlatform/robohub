#
# robohub-provider-email — the e-mail transport.
#
module:
  name: robohub-provider-email
  id: robohub.provider.email
  previous_ids:
    - robohub.providers.email
  type: provider
  version: 0.2.3
  description: Sends an alert by local outbox or SMTP.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/provider.rho

# It implements the alert interface: an application that binds it receives
# its alerts through it, and reads its settings from the binding.
implements: [robohub.alert]

provides:
  import: robohub.alert_email
  exports: [send]
  settings:
    - mode
    - to_address
    - from_address
    - app
    - subject_template
    - body_template
    - smtp_host
    - smtp_port
    - smtp_security
    - smtp_user
    - smtp_pass
    - severity_threshold


metadata:
  tags:
    - provider
    - alert
    - email

docs:
  title: robohub-provider-email
  section: providers
  order: "20"
  index: README.md
  sources:
    - README.md
