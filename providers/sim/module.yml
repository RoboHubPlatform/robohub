#
# robohub-provider-sim — the simulation gateway transport.
#
# The provider is the gateway contract's `sim` transport. An application in
# simulation mode writes `transport=sim;base=<url>` to gateway.conf and the
# contract asks this provider; the answers come from the application's simulated
# source endpoints, in the same shape Mesh returns. Switching to real-time mode
# writes the mesh transport instead, so the same widgets see the real project.
#
module:
  name: robohub-provider-sim
  id: robohub.provider.sim
  previous_ids:
    - robohub.providers.sim
  type: provider
  version: 0.1.0
  description: Serves an application's simulated sources to the gateway contract.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-09"

main: src/provider.rho

provider:
  contract: gateway
  transport: sim
  summary: The energy application's simulated source endpoints behind the gateway contract.

metadata:
  tags:
    - provider
    - gateway
    - simulation

docs:
  title: robohub-provider-sim
  section: providers
  order: "51"
  index: README.md
  sources:
    - README.md
