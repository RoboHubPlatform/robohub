#
# robohub-provider-webhook — the generic HTTP transport.
#
module:
  name: robohub-provider-webhook
  id: robohub.provider.webhook
  previous_ids:
    - robohub.providers.webhook
  type: provider
  version: 0.2.1
  description: Posts an alert body to an HTTP endpoint.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/provider.rho

# It implements the alert interface: an application that binds it receives
# its alerts through it, and reads its settings from the binding.
implements: [robohub.alert]

provides:
  import: robohub.alert_webhook
  exports: [send]
  settings:
    - url
    - content_type
    - authorization
    - severity_threshold


metadata:
  tags:
    - provider
    - alert
    - webhook

docs:
  title: robohub-provider-webhook
  section: providers
  order: "40"
  index: README.md
  sources:
    - README.md
