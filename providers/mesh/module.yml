#
# robohub-provider-mesh — the Mesh gateway transport.
#
# A provider of the gateway interface (robohub-gateway). An application declares
# it and binds it:
#
#   bind:
#     robohub.gateway:
#       providers: [robohub-provider-mesh]
#       config:
#         robohub-provider-mesh:
#           url: http://127.0.0.1:8478
#           project: default
#
module:
  name: robohub-provider-mesh
  id: robohub.provider.mesh
  previous_ids:
    - robohub.providers.mesh
  type: provider
  version: 0.5.4
  description: Serves Mesh projects, sources, gateway state and telemetry to an application, as a provider of the gateway interface.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-04"

main: src/provider.rho

# It logs through the toolchain's logger.
deps:
  rho-log: ">=0.1.2"

# The broker transport follows Mesh's relayed feed through the RoboHub
# platform's mqtt port, with the broker user the keeper gave the application.
ports:
  - mqtt

# It implements the gateway interface: an application that binds it reaches
# Mesh through it, with Mesh's address and the project from the binding.
implements: [robohub.gateway]

provides:
  import: robohub.gateway_mesh
  exports:
    - projects
    - gateway
    - sources
    - nodes
    - device_states
    - follow
    - transport
    - action
    - source_state
    - source_latest
    - source_history
    - register_client
    - client_heartbeat
    - publish
    - telemetry_status
  settings:
    - url
    - project
    - transport

metadata:
  tags:
    - provider
    - gateway
    - mesh

docs:
  title: robohub-provider-mesh
  section: providers
  order: "50"
  index: README.md
  sources:
    - README.md
