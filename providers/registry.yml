# The provider registry.
#
# This is the installed set, read the same way plugins/registry.yml is. Each
# provider is a module of its own with a module.yml identity; this file is what
# the keeper lists and what an install or uninstall edits. An application does
# not reach a provider through this file: it depends on the provider and binds
# it to the interface it implements. The file is what makes it a module a person
# can install and inspect like any other.
providers:
  - name: robohub-provider-log
    path: log
    implements: robohub.alert
    transport: log
    enabled: true
  - name: robohub-provider-email
    path: email
    implements: robohub.alert
    transport: email
    enabled: true
  - name: robohub-provider-telegram
    path: telegram
    implements: robohub.alert
    transport: telegram
    enabled: true
  - name: robohub-provider-webhook
    path: webhook
    implements: robohub.alert
    transport: webhook
    enabled: true
  - name: robohub-provider-mesh
    path: mesh
    implements: gateway
    transport: mesh
    enabled: true
  - name: robohub-provider-mqtt
    path: mqtt
    implements: robohub.bus
    transport: mqtt
    enabled: true
