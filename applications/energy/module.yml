#
# energy — the RoboHub energy application.
#
# One HTTP service on one port, for one location. It normalizes what generation,
# storage and the grid report, decides which topology the site is running in,
# evaluates the safety interlocks, writes power faults into the telemetry store,
# and keeps every open dashboard current over Server-Sent Events.
#
# It is a modular monolith in the aquarium sense: the reusable UI modules it
# carries (forms, settings, notifications, i18n, htmx) register on this router,
# and the host owns the database, the workspace and the port.
#
module:
  name: energy
  id: robohub.app.energy
  previous_ids:
    - robohub.applications.energy
  type: rho
  version: 0.1.1
  kind: keeper-hosted
  title: Energy
  description: >
    The power brain of a RoboHub location: solar, wind, LiFePO4 storage and the
    utility line, normalized into one site reading; off-grid, on-grid and
    hybrid operating modes; safety interlocks and live SSE fault badges.
  route: /
  port: "8482"
  command: energy
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-09"

platform: robohub

main: src/main.rho

build:
  language: go
  targets:
    - go-server

# The reusable modules this application carries. The keeper uses this list to
# know which application serves a module's routes.
modules:
  - name: inventory
    route: /expenses
    enabled: true
  - name: scheduler
    route: /scheduler
    enabled: true
  - name: widgets
    route: /widgets
    enabled: true

# The gateway provider this application uses. The energy application does not
# know Mesh's API; it asks the gateway contract, and this plugin answers. In
# simulation mode the gateway is idle; in real-time mode the same provider that
# feeds an aquarium dashboard feeds the energy one.
plugins:
  - name: robohub-auth
    enabled: true
    config:
      issuer: keeper
      mode: direct
      login_url: "http://127.0.0.1:19090/auth/login"
  - name: mesh-gateway
    enabled: true
    config:
      url: "http://127.0.0.1:8478"
      project: "default"
      token: ""

# The runtime package the generated SQL calls into.
requires:
  - name: rho/sqlite

# The SQL port is generated from these two files. The energy domain and the
# telemetry tables live in one schema, so the same statements that serve the
# pages also create the store the telemetry port writes faults into.
sql:
  driver: rho-sql-sqlite
  schema: db/schema.sql
  queries: db/queries.sql
  out: src/db

deps:
  rho-log: ">=0.1.2"
  rho-sql: ">=0.1.0"
  robohub:
    htmx: ">=0.1.0"
    i18n: ">=0.1.0"
    settings: ">=0.1.0"
    forms: ">=0.1.0"
    notifications: ">=0.1.0"
    logging: ">=0.1.0"
    inventory: ">=0.1.3"
    scheduler: ">=0.1.3"
    widgets: ">=0.2.3"
    robohub-auth: ">=0.1.0"
    mesh-gateway: ">=0.2.1"
    robohub-contract-gateway: ">=0.1.0"

deploy:
  port: 8482
  service: energy
  # The services it calls; keeper registers it as a client for these alone.
  calls: [mesh]

docs:
  title: Energy
  section: applications
  order: "45"
  index: docs/index.md
  sources:
    - docs/index.md

# The application's own documentation page, embedded at build time.
assets:
  - docs/index.md
