<div class="page-head">
  <p class="eyebrow">{{t "energy.faults.eyebrow"}}</p>
  <h1>{{t "energy.faults.title"}}</h1>
  <p>{{t "energy.faults.intro"}} <strong>{{ project }}</strong></p>
</div>
<div hx-ext="sse" sse-connect="/energy/stream">
  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>{{t "energy.field.severity"}}</th>
          <th>{{t "energy.field.created"}}</th>
          <th>{{t "energy.field.message"}}</th>
          <th></th>
        </tr></thead>
        <tbody id="faults-rows" sse-swap="faults-rows" hx-swap="innerHTML">{{{ rows }}}</tbody>
      </table>
    </div>
  </div>
</div>
