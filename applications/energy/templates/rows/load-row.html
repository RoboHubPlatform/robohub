<tr>
  <td>
    <strong>{{ name }}</strong><br>
    <small>{{ zone }} · {{ critical }}</small>
  </td>
  <td>{{ priority }}</td>
  <td>{{ power }}</td>
  <td>
    <span class="status-pill {{ state_css }}">{{ state }}</span><br>
    <small>{{ shed }}</small>
  </td>
  <td>
    <form method="post" action="/loads/toggle">
      <input type="hidden" name="id" value="{{ id }}">
      {{{ csrf }}}
      <select name="state"><option>on</option><option>off</option></select>
      <button type="submit" class="quiet">{{t "energy.field.set"}}</button>
    </form>
    <form method="post" action="/loads/toggle">
      <input type="hidden" name="id" value="{{ id }}">
      <input type="hidden" name="state" value="">
      {{{ csrf }}}
      <select name="shed"><option value="1">{{t "energy.field.shed"}}</option><option value="0">{{t "energy.field.connect"}}</option></select>
      <button type="submit" class="quiet">{{t "energy.field.apply"}}</button>
    </form>
    <form method="post" action="/loads/delete">
      <input type="hidden" name="id" value="{{ id }}">
      {{{ csrf }}}
      <button type="submit" class="quiet">{{t "energy.field.remove"}}</button>
    </form>
  </td>
</tr>
