# What the energy go-server target has that the toolchain's built-in one does
# not. The files, the kind, the router and the output folders are the built-in
# target's.

targets:
  - id: go-server
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: energy
          public_key: ~/.rho/auth/public.pem
          mode: direct
          login_url: "/auth/login?audience=energy"
          scheme: auto
          skip_paths: "/healthz,/auth/login,/assets,/assets/,/i18n,/auth/callback,/static"
    ports:
      - logemit
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
    # Every file under templates/ is a template, named by its file name.
    templates:
      - dir: templates
