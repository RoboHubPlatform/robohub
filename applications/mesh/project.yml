version: 1

output_dir: build/generated
build_dir: build

targets:
  - id: go-server
    emitter: go
    kind: server
    description: RoboHub Mesh HTTP service
    router: serveMux
    ports:
      - logemit
      - docstore
      - telemetry
    api:
      public_paths: "/, /mesh, /mesh/docs"
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: mesh
          cookie: mesh_session
          public_key: ${RHO_HOME}/auth/public.pem
          mode: direct
          login_url: "/auth/login?audience=mesh"
          scheme: auto
          # The overview and the documentation are the shop window; the API
          # that reads telemetry, devices and sensors is not.
          skip_paths: "/healthz,/auth/login,/assets,/assets/,/auth/callback,/static,/mesh/docs"
    templates:
      - name: layout
        file: templates/layouts/layout.html
      - name: mesh
        file: templates/pages/mesh.html
      - name: mesh-dashboard
        file: templates/pages/mesh-dashboard.html
      - name: mesh-build
        file: templates/pages/mesh-build.html
      - name: mesh-network
        file: templates/pages/mesh-network.html
      - name: mesh-project-settings
        file: templates/pages/mesh-project-settings.html
      - name: wizard
        file: templates/pages/wizard.html
      - name: wizard-step
        file: templates/pages/wizard-step.html
      - name: mesh-status
        file: templates/parts/mesh-status.html
      - name: mesh-card-device
        file: templates/cards/mesh-card-device.html
      - name: mesh-card-module
        file: templates/cards/mesh-card-module.html
      - name: mesh-card-node
        file: templates/cards/mesh-card-node.html
      - name: mesh-card-gateway
        file: templates/cards/mesh-card-gateway.html
      - name: mesh-card-link
        file: templates/cards/mesh-card-link.html
      - name: mesh-card-readonly
        file: templates/cards/mesh-card-readonly.html
      - name: mesh-badge
        file: templates/tree/mesh-badge.html
      - name: mesh-branch
        file: templates/tree/mesh-branch.html
      - name: mesh-children
        file: templates/tree/mesh-children.html
      - name: mesh-orphans
        file: templates/tree/mesh-orphans.html
      - name: mesh-empty
        file: templates/tree/mesh-empty.html
      - name: mesh-quick-add
        file: templates/tree/mesh-quick-add.html
      - name: mesh-tree
        file: templates/tree/mesh-tree.html
      - name: mesh-option
        file: templates/parts/mesh-option.html
      - name: mesh-step-card
        file: templates/parts/mesh-step-card.html
      - name: mesh-steps
        file: templates/parts/mesh-steps.html
      - name: mesh-message
        file: templates/parts/mesh-message.html
      - name: mesh-console
        file: templates/parts/mesh-console.html
      - name: mesh-panel
        file: templates/parts/mesh-panel.html
      - name: mesh-settings
        file: templates/parts/mesh-settings.html
      - name: mesh-setting
        file: templates/parts/mesh-setting.html
      - name: mesh-unknown-step
        file: templates/parts/mesh-unknown-step.html
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
