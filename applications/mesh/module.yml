#
# mesh — the RoboHub Mesh application.
#
# It is a keeper-hosted application: it runs on its own HTTP port, standalone or
# launched by the keeper. The `application` block is what tells the keeper that
# this module is a hosted application rather than a service like the docsite or
# the keeper itself.
#
module:
  name: mesh
  id: robohub.app.mesh
  previous_ids:
    - robohub.applications.mesh
  type: rho
  kind: keeper-hosted
  title: RoboHub Mesh
  route: /mesh
  port: 8478
  command: mesh
  version: 0.5.3
  author: Aurel Miron
  maintainer: Aurel Miron
description: >
  Plans and runs RoboHub gateway deployments: projects, a gateway and its
  nodes, the network between them, and the firmware on their boards.

platform: robohub

main: src/main.rho

build:
  language: go
  targets:
    - go-server

# Mesh owns the telemetry store other applications read. The schema is
# declarative because the port that ingests a gateway's outbox writes the rows
# it declares, and the sql port embeds it so the database is created by the
# same reading of the same file.

requires:
  - name: rho/sqlite

sql:
  driver: rho-sql-sqlite
  schema: db/schema.sql
  out: src/db

deps:
  rho-log: ">=0.1.2"
  robohub:
    logging: ">=0.1.0"
    htmx: ">=0.1.0"
    i18n: ">=0.1.0"
    settings: ">=0.1.0"
    forms: ">=0.1.0"
    robohub-auth: ">=0.1.0"
    alert-dispatcher: ">=0.1.0"
    alert-log: ">=0.1.0"
    email-alert: ">=0.1.0"
    telegram-notifier: ">=0.1.0"
  rho-sql: ">=0.1.0"

# A hosted application is not a service the keeper is: it has its own listener,
# its own lifetime and its own command. The keeper reads this block to offer it
# in its applications registry.

# The alert channels this application uses. The dispatcher is the one alert
# plugin the application calls; it fans out to the channels named in targets.
plugins:
  - name: robohub-auth
    enabled: true
    config:
      issuer: keeper
      mode: direct
      login_url: "http://127.0.0.1:19090/auth/login"
  - name: alert-dispatcher
    enabled: true
    config:
      targets: "alert-log,email-alert,telegram-notifier"
      severity_threshold: INFO
  - name: alert-log
    enabled: true
    config:
      path: "~/.rho/mesh/alerts.log"
      severity_threshold: INFO
  - name: email-alert
    enabled: false
    config:
      provider: local
      from_address: "alerts@robohub.internal"
      to_address: "ops@robohub.internal"
      subject_template: "[RoboHub {app}] {level}: {rule}"
      body_template: "{message}"
      severity_threshold: ERROR
  - name: telegram-notifier
    enabled: false
    config:
      bot_token: ""
      chat_id: ""
      severity_threshold: WARNING

deploy:
  port: 8478
  service: mesh
  # The services it calls; keeper registers it as a client for these alone.
  calls: ["gateway:*", energy]

docs:
  title: The RoboHub Mesh application
  section: applications
  order: "31"
  index: docs/index.md
  sources:
    - docs/index.md
