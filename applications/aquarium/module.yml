#
# aquarium — the RoboHub aquarium application.
#
# One HTTP service with one port. The domain handlers and the reusable modules
# it carries all register on the same router; the inventory module is included
# from modules/inventory and serves /expenses.
#
module:
  name: aquarium
  id: robohub.app.aquarium
  previous_ids:
    - robohub.applications.aquarium
  type: rho
  version: 0.4.0
  kind: keeper-hosted
  title: Aquarium
  description: >
    The RoboHub aquarium controller: water chemistry, equipment, schedules and
    the inventory of what keeps them running.
  route: /
  port: "8480"
  command: aquarium
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/main.rho

build:
  language: go
  targets:
    - go-server


# The reusable modules this application carries. The keeper uses this list to
# know which application serves a module's routes.
# The module instance is configured here, not in the module: its route and the
# database files the host's SQL port is generated from belong to this
# application. The workspace its records live in follows the application's
# ROBOHUB_APP_WORKSPACE.
modules:
  - name: inventory
    route: /expenses
    enabled: true
  - name: scheduler
    route: /scheduler
    enabled: true
  - name: widgets
    route: /widgets
    enabled: true

# The plugins this application uses: how it signs a person in. Mesh is reached
# through the gateway interface, bound below.
plugins:
  - name: robohub-auth
    enabled: true
    config:
      issuer: keeper
      mode: direct
      login_url: "http://127.0.0.1:19090/auth/login"

# The application has a database, so the SQL port is generated for it. The
# tables it uses are the module's; the host's own schema may grow with the
# aquarium domain.
requires:
  - name: rho/sqlite

sql:
  driver: rho-sql-sqlite
  schema: db/schema.sql
  queries: db/queries.sql
  out: src/db


deps:
  rho-log: ">=0.1.0"
  rho-sql: ">=0.1.0"
  robohub:
    htmx: ">=0.1.0"
    i18n: ">=0.1.0"
    settings: ">=0.1.0"
    forms: ">=0.1.0"
    notifications: ">=0.1.0"
    logging: ">=0.1.0"
    inventory: ">=0.1.0"
    scheduler: ">=0.1.0"
    widgets: ">=0.1.0"
    robohub-auth: ">=0.1.0"
    robohub-gateway: ">=1.0.0"
    robohub-provider-mesh: ">=0.3.0"

# The gateway this application reaches the mesh through, and its settings. The
# Settings page changes them on a running installation (bind.conf in the
# application's workspace); these are the defaults.
bind:
  robohub.gateway:
    providers:
      - robohub-provider-mesh
    config:
      robohub-provider-mesh:
        url: "http://127.0.0.1:8478"
        project: "default"

deploy:
  port: 8480
  service: aquarium
  # The services it calls; keeper registers it as a client for these alone.
  calls: [mesh]

docs:
  title: Aquarium
  section: applications
  order: "40"
  index: docs/index.md
  sources:
    - docs/index.md

# The application's own documentation page, embedded at build time.
assets:
  - docs/index.md
