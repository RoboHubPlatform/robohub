<style>
.settings-tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin: 1rem 0 1.2rem; border-bottom: 1px solid rgba(228,184,102,.25); }
.settings-tabs a { padding: .45rem .8rem; border-radius: 8px 8px 0 0; color: var(--muted, #8aa0b8); text-decoration: none; font-size: .82rem; }
.settings-tabs a:hover { color: #e4b866; }
.settings-tabs a.active { color: #1b2a3a; background: #e4b866; font-weight: 700; }
.settings dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; }
.settings dt { color: var(--muted, #8aa0b8); }
.settings dd { margin: 0; }
</style>
