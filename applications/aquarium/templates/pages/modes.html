<h1>Operational modes</h1>
<p>Water change and feeding pause the equipment they name and resume when the timer expires.</p>
<form class="panel-form" method="post" action="/modes/start">
  <div class="grid">
    <label>Mode<select name="name"><option>water_change</option><option>feeding</option></select></label>
    <label>Duration (minutes)<input name="minutes" value="30" inputmode="numeric"></label>
    <label>Note<input name="note"></label>
  </div>
  <div class="form-actions"><button type="submit">Start mode</button></div>
</form>
<form class="panel-form" method="post" action="/modes/stop">
  <div class="form-actions"><button type="submit" class="quiet">Resume normal operation</button></div>
</form>
<p><small>Current time: {{ now }}</small></p>
