<h1>Equipment</h1>
<p>Pumps, lights, heaters and the devices around them. Without a board a device is a row with a state and the last value reported; the same row becomes real when a node binds it.</p>
<form class="panel-form" method="post" action="/equipment/add">
  <div class="grid">
    <label>Name<input name="name" required placeholder="Return pump"></label>
    <label>Kind<input name="kind" placeholder="pump, light, heater, fan, sensor"></label>
    <label>Initial state<select name="state"><option>off</option><option>on</option></select></label>
  </div>
  <div class="form-actions"><button type="submit">Add equipment</button></div>
</form>
<h2>Devices</h2>
<table>
  <thead><tr><th>Name</th><th>Kind</th><th>State</th><th>Last value</th><th></th></tr></thead>
  <tbody>{{{ rows }}}</tbody>
</table>
