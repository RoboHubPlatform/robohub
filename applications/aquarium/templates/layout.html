<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · RoboHub Aquarium</title>
<style>
  :root {
    --ink: #f4efe4; --muted: #c7c0b2; --faint: #a9a294;
    --gold: #e4b866; --teal: #79c7bd; --panel: rgba(18, 24, 25, .66);
    --line: rgba(244, 239, 228, .18); --glass: rgba(15, 20, 21, .58);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
    background:
      linear-gradient(180deg, rgba(5, 11, 15, .55) 0%, rgba(5, 13, 17, .28) 38%, rgba(4, 10, 13, .72) 100%),
      url("/static/aquarium-background.jpg") center / cover fixed no-repeat,
      radial-gradient(1200px 700px at 50% 10%, #2d5c63 0%, #0a1418 70%);
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: #f3d59a; }
  .topbar, .bottombar {
    position: fixed; left: 0; right: 0; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; gap: 1rem; padding: .7rem 1.6rem;
    background: linear-gradient(180deg, rgba(7, 14, 17, .82), rgba(7, 14, 17, .52));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar { top: 0; }
  .bottombar { bottom: 0; border-top: 1px solid var(--line); border-bottom: 0; font-size: .78rem; color: var(--muted); }
  .brand { font-family: var(--serif); font-size: 1.05rem; letter-spacing: .04em; }
  .brand em { color: var(--teal); font-style: normal; }
  nav { display: flex; align-items: center; gap: 1rem; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; }
  nav a { color: var(--muted); }
  nav a.active, nav a:hover { color: var(--gold); }
  .bottombar nav a { text-transform: none; letter-spacing: 0; }
  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 6.2rem 1.6rem 6rem; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: .01em; margin: 0 0 .4rem; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 0 0 .4rem; }
  p { color: var(--muted); margin: .3rem 0 .9rem; max-width: 62ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: 1.6rem; }
  .card {
    padding: 1.2rem 1.25rem; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .card h2 { color: var(--ink); }
  .card p { font-size: .86rem; margin-bottom: 1rem; }
  .card a { font-size: .84rem; letter-spacing: .03em; text-transform: uppercase; }
  .dash-title { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 1.8rem 0 .6rem; }
  .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 0 0 1.4rem; }
  .widget-card { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); box-shadow: 0 18px 50px rgba(0,0,0,.22); }
  .widget-card h3 { margin: 0 0 .4rem; font-family: var(--serif); font-weight: 500; font-size: 1rem; }
  .widget-value { font-family: var(--serif); font-size: 1.9rem; color: var(--gold); }
  .spark { width: 100%; height: 54px; display: block; margin: .4rem 0; }
  .switch { display: inline-flex; align-items: center; gap: .45rem; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: .35rem .6rem; }
  .switch span { width: 1.5rem; height: .85rem; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; display: inline-block; }
  .switch span::after { content: ""; position: absolute; top: .1rem; left: .1rem; width: .65rem; height: .65rem; border-radius: 50%; background: var(--muted); transition: left .15s ease; }
  .switch.on { color: var(--teal); border-color: var(--teal); }
  .switch.on span { background: rgba(121,199,189,.35); }
  .switch.on span::after { left: .75rem; background: var(--teal); }
  .panel-form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; backdrop-filter: blur(12px); }
  .keeper[data-keeper-port] { color: var(--teal); }
  footer .keeper { color: var(--teal); }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">RoboHub <em>Aquarium</em></div>
  <nav>
    <a href="/" class="active">Home</a>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/widgets">Widgets</a>
    <a href="/equipment">Equipment</a>
    <a href="/automation">Automation</a>
    <a href="/chemistry">Chemistry</a>
    <a href="/modes">Modes</a>
    <a href="/events">Events</a>
    <a href="/settings">Settings</a>
    {{{ keeper }}}
  </nav>
</header>
<main>{{{ body }}}</main>
<footer class="bottombar">
  <span>Water, light and what keeps them running.</span>
  <nav>
    <a href="/">Overview</a>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/equipment">Equipment</a>
    <a href="/automation">Automation</a>
    <a href="/events">Events</a>
    <a href="/settings">Settings</a>
    {{{ keeper }}}
  </nav>
</footer>
<script>
(function () {
  document.querySelectorAll(".keeper[data-keeper-port]").forEach(function (el) {
    var port = el.getAttribute("data-keeper-port");
    if (port) {
      el.href = location.protocol + "//" + location.hostname + ":" + port + "/";
    }
  });
})();
</script>
</body>
</html>
