<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>{{ title }} · RoboHub Aquarium</title>
<style>
  :root {
    --ink: #f4efe4; --muted: #c7c0b2; --faint: #a9a294;
    --gold: #e4b866; --teal: #79c7bd; --panel: rgba(18, 24, 25, .66);
    --line: rgba(244, 239, 228, .18); --glass: rgba(15, 20, 21, .58);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
    background:
      linear-gradient(180deg, rgba(5, 11, 15, .55) 0%, rgba(5, 13, 17, .28) 38%, rgba(4, 10, 13, .72) 100%),
      url("/static/aquarium-background.jpg") center / cover fixed no-repeat,
      radial-gradient(1200px 700px at 50% 10%, #2d5c63 0%, #0a1418 70%);
  }
  a { color: var(--gold); text-decoration: none; }
  a:hover { color: #f3d59a; }
  .topbar, .bottombar {
    position: fixed; left: 0; right: 0; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; gap: 1rem; padding: .7rem 1.6rem;
    background: linear-gradient(180deg, rgba(7, 14, 17, .82), rgba(7, 14, 17, .52));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar { top: 0; }
  .bottombar { bottom: 0; border-top: 1px solid var(--line); border-bottom: 0; font-size: .78rem; color: var(--muted); }
  .brand { font-family: var(--serif); font-size: 1.05rem; letter-spacing: .04em; }
  .brand em { color: var(--teal); font-style: normal; }
  nav { display: flex; align-items: center; gap: 1rem; font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; }
  nav a { color: var(--muted); }
  nav a.active, nav a:hover { color: var(--gold); }
  .bottombar nav a { text-transform: none; letter-spacing: 0; }
  main { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 6.2rem 1.6rem 6rem; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: .01em; margin: 0 0 .4rem; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 0 0 .4rem; }
  p { color: var(--muted); margin: .3rem 0 .9rem; max-width: 62ch; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: 1.6rem; }
  .card {
    padding: 1.2rem 1.25rem; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
  }
  .card h2 { color: var(--ink); }
  .card p { font-size: .86rem; margin-bottom: 1rem; }
  .card a { font-size: .84rem; letter-spacing: .03em; text-transform: uppercase; }
  .dash-title { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 1.8rem 0 .6rem; }
  .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 0 0 1.4rem; }
  .widget-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .widget-card { padding: .7rem .85rem; }
  .widget-card h3 a { color: inherit; text-decoration: none; }
  .widget-card h3 a:hover { color: var(--accent); text-decoration: underline; }
  .toggle-card .switch { padding: .6rem 1rem; font-size: 1.05rem; gap: .7rem; }
  .toggle-card .switch span:first-child { width: 2.6rem; height: 1.5rem; }
  .toggle-card .switch span:first-child::after { width: 1.15rem; height: 1.15rem; top: .175rem; left: .15rem; }
  .toggle-card .switch.on span:first-child::after { left: 1.3rem; }
.widget-card { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); box-shadow: 0 18px 50px rgba(0,0,0,.22); }
  .switch .switch-text { width: auto; height: auto; background: none; }
  .widget-card h3 { margin: 0 0 .4rem; font-family: var(--serif); font-weight: 500; font-size: 1rem; padding-left: 1.6rem; }
  .widget-value { font-family: var(--serif); font-size: 1.9rem; color: var(--gold); }
  .widget-value-wrap { position: relative; text-align: center; margin: .6rem 0; }
  .widget-value-wrap { position: relative; text-align: center; margin: .6rem 0; display: inline-block; width: 100%; }
  .widget-unit { position: absolute; top: 0; right: 0; font-size: .85rem; color: var(--muted); }
  .widget-value-big { font-family: var(--serif); font-size: 3rem; color: var(--gold); }
  .widget-card.size-medium .widget-value-big { font-size: 4rem; }
  .widget-card.size-big .widget-value-big { font-size: 5.5rem; }
  .spark { width: 100%; height: 54px; display: block; margin: .4rem 0; }
  .switch { cursor: pointer; touch-action: manipulation; display: inline-flex; align-items: center; gap: .45rem; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: .35rem .6rem; }
  .switch span:first-child { width: 1.5rem; height: .85rem; border-radius: 999px; background: rgba(255,255,255,.15); position: relative; display: inline-block; }
  .switch span:first-child::after { content: ""; position: absolute; top: .1rem; left: .1rem; width: .65rem; height: .65rem; border-radius: 50%; background: var(--muted); transition: left .15s ease; }
  .switch.on { color: var(--teal); border-color: var(--teal); }
  .switch.on span:first-child { background: rgba(121,199,189,.35); }
  .switch.on span:first-child::after { left: .75rem; background: var(--teal); }
  .panel-form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; backdrop-filter: blur(12px); }
  .keeper[data-keeper-port] { color: var(--teal); }
  footer .keeper { color: var(--teal); }
}
  .widget-card { position: relative; }
  .wctl-pin { position: absolute; top: .35rem; left: .35rem; display: flex; gap: .2rem; z-index: 2; }
  .wctl-size { position: absolute; top: .35rem; right: .35rem; display: flex; gap: .2rem; z-index: 2; }
  .wctl-move { position: absolute; bottom: .35rem; left: 50%; transform: translateX(-50%); display: flex; gap: .2rem; z-index: 2; }
  .icon-btn { font: inherit; width: 1.3rem; height: 1.3rem; padding: 0; border: 1px solid rgba(244,239,228,.16); border-radius: 50%; background: rgba(15,20,21,.4); color: var(--muted); cursor: pointer; font-size: .6rem; line-height: 1; backdrop-filter: blur(6px); display: inline-flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s, background .15s; }
  .icon-btn:hover { color: var(--gold); border-color: var(--gold); background: rgba(15,20,21,.6); }
  .widget-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin: 0 0 1.4rem; }
  .widget-card.size-small { grid-column: span 1; }
  .widget-card.size-medium { grid-column: span 2; }
  .widget-card.size-big { grid-column: span 4; }
{{{ forms_style }}}
{{{ notifications }}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">RoboHub <em>Aquarium</em></div>
  <nav>
    <a href="/">Home</a>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/widgets">Widgets</a>
    <a href="/equipment">Equipment</a>
    <a href="/automation">Automation</a>
    <a href="/chemistry">Chemistry</a>
    <a href="/modes">Modes</a>
    <a href="/events">Events</a>
    <a href="/settings">Settings</a>
    {{{ keeper }}}
  </nav>
</header>
<main>{{{ body }}}</main>
{{{ notifications }}}
<footer class="bottombar">
  <span id="status-inventory">Items: —</span>
  <span id="status-scheduler">Tasks: —</span>
  <span id="status-widgets"></span>
  <nav>
    <a href="/expenses">Inventory</a>
    <a href="/scheduler">Scheduler</a>
    <a href="/widgets">Widgets</a>
    <a href="/docs">Documentation</a>
    {{{ keeper }}}
  </nav>
</footer>
<script>
(function () {
  document.querySelectorAll(".keeper[data-keeper-port]").forEach(function (el) {
    var port = el.getAttribute("data-keeper-port");
    if (port) {
      el.href = location.protocol + "//" + location.hostname + ":" + port + "/";
    }
  });
  document.querySelectorAll(".local-time[data-s]").forEach(function (el) {
    var seconds = Number(el.getAttribute("data-s"));
    if (seconds > 0) { el.textContent = new Date(seconds * 1000).toLocaleString(); }
  });
  // status bar: inventory count, scheduler tasks, pinned widgets
  function updateStatusBar() {
    fetch("/api/expenses/data").then(function (r) { return r.json(); }).then(function (d) {
      var el = document.getElementById("status-inventory");
      if (el) { el.textContent = "Items: " + (d.item_count || 0); }
    }).catch(function () {});
    fetch("/api/scheduler/chores").then(function (r) { return r.json(); }).then(function (items) {
      var el = document.getElementById("status-scheduler");
      if (el) { el.textContent = "Tasks: " + (Array.isArray(items) ? items.length : 0); }
    }).catch(function () {});
    fetch("/api/widgets").then(function (r) { return r.json(); }).then(function (items) {
      var pinned = items.filter(function (w) { return w.pinned === 1; });
      var el = document.getElementById("status-widgets");
      if (el) {
        el.textContent = pinned.map(function (w) { return w.title + ": " + (w.latest || "") + " " + (w.unit || ""); }).join(" · ");
      }
    }).catch(function () {});
  }
  updateStatusBar();
  setInterval(updateStatusBar, 5000);
})();
</script>

<script>
(function () {
  function updateSwitch(id, state) {
    var card = document.querySelector('[data-widget-id="' + id + '"]');
    if (!card) { return; }
    var sw = card.querySelector('.switch');
    if (!sw) { return; }
    var on = state === 'on';
    sw.classList.toggle('on', on);
    var label = sw.querySelector('.switch-text');
    if (label) { label.textContent = on ? 'On' : 'Off'; }
  }

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') { return; }
    if (!form.action || form.action.indexOf('/widgets/') < 0) { return; }
    // Let the install/add forms do a normal submit.
    if (form.action.indexOf('/widgets/add') >= 0 || form.action.indexOf('/widgets/edit') >= 0) { return; }
    event.preventDefault();
    var fields = new URLSearchParams(new FormData(form));
    fetch(form.action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: fields.toString()
    })
      .then(function (response) { return response.text(); })
      .then(function (text) {
        var result = {};
        try { result = JSON.parse(text); } catch (error) { /* keep going */ }
        var id = (form.querySelector && form.querySelector('[name="id"]')) ? form.querySelector('[name="id"]').value : null;
        if (id && result.state) {
          var card = document.querySelector('[data-widget-id="' + id + '"]');
          if (card) {
            var sw = card.querySelector('.switch');
            if (sw) {
              var on = result.state === 'on';
              sw.classList.toggle('on', on);
              var label = sw.querySelector('.switch-text');
              if (label) { label.textContent = on ? 'On' : 'Off'; }
            }
          }
        }
        if (typeof reloadCards === 'function') { reloadCards(); }
      })
      .catch(function () { if (typeof reloadCards === 'function') { reloadCards(); } });
  });

  try {
    var events = new EventSource('/widgets/events');
    events.onmessage = function (message) {
      var parts = message.data.split(':');
      if (parts.length === 3 && parts[0] === 'widget') {
        updateSwitch(parts[1], parts[2]);
      } else if (parts[0] === 'cards') {
        reloadCards();
      }
    };
  } catch (error) {
    // The switch still posts without the stream.
  }

  function syncFromApi() {
    fetch('/api/widgets?t=' + Date.now(), { cache: 'no-store' })
      .then(function (response) { return response.json(); })
      .then(function (items) {
        items.forEach(function (widget) {
          if (widget.kind === 'toggle' && widget.latest) {
            updateSwitch(String(widget.id), widget.latest);
          }
        });
      })
      .catch(function () {});
  }

  function reloadCards() {
    fetch('/widgets/cards?t=' + Date.now(), { cache: 'no-store' })
      .then(function (response) { return response.text(); })
      .then(function (html) {
        var grid = document.querySelector('.widget-grid');
        if (grid && grid.outerHTML !== html) { grid.outerHTML = html; }
      })
      .catch(function () {});
  }

  function refresh() {
    fetch('/widgets/refresh', { method: 'POST' })
      .then(function (response) { return response.json(); })
      .then(function (result) {
        if (result.updated > 0) { syncFromApi(); }
        if (result.changed > 0) { reloadCards(); }
      })
      .catch(reloadCards);
  }
  syncFromApi();
  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
