version: 1

output_dir: build/generated
build_dir: build

targets:
  - id: go-server
    emitter: go
    kind: server
    description: Aquarium HTTP service
    router: serveMux
    ports:
      - logemit
    api:
      public_paths: "/, /expenses, /scheduler, /api/scheduler, /widgets, /api/widgets"
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: aquarium
          public_key: ~/.rho/auth/public.pem
          mode: direct
          skip_paths: "/healthz,/auth/login,/assets,/assets/,/i18n,/auth/callback,/static,/api/aquarium/mesh/events,/docs"
          login_url: "/auth/login?audience=aquarium"
          scheme: auto
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
    templates:
      - name: layout
        file: templates/layouts/layout.html
      - name: home
        file: templates/pages/home.html
      - name: settings
        file: templates/pages/settings.html
      - name: modes
        file: templates/pages/modes.html
      - name: equipment
        file: templates/pages/equipment.html
      - name: equipment-row
        file: templates/rows/equipment-row.html
      - name: automation
        file: templates/pages/automation.html
      - name: automation-row
        file: templates/rows/automation-row.html
      - name: chemistry
        file: templates/pages/chemistry.html
      - name: chemistry-row
        file: templates/rows/chemistry-row.html
      - name: events
        file: templates/pages/events.html
      - name: events-row
        file: templates/rows/events-row.html
