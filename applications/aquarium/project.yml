version: 1

output_dir: build/generated
build_dir: build

targets:
  - id: go-server
    emitter: go
    kind: server
    description: Aquarium HTTP service
    router: serveMux
    ports:
      - logemit
    api:
      public_paths: "/, /expenses, /scheduler, /api/scheduler, /widgets, /api/widgets"
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: aquarium
          cookie: aquarium_session
          public_key: ${RHO_HOME}/auth/public.pem
          mode: direct
          skip_paths: "/healthz,/auth/login,/auth/callback,/static,/expenses,/api/expenses,/widgets,/api/widgets,/notifications/stream"
          login_url: "/auth/login?audience=aquarium"
          scheme: auto
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
    templates:
      - name: layout
        file: templates/layout.html
      - name: home
        file: templates/home.html
      - name: settings
        file: templates/settings.html
      - name: gateway-option
        file: templates/gateway-option.html
      - name: modes
        file: templates/modes.html
      - name: equipment
        file: templates/equipment.html
      - name: equipment-row
        file: templates/equipment-row.html
      - name: automation
        file: templates/automation.html
      - name: automation-row
        file: templates/automation-row.html
      - name: chemistry
        file: templates/chemistry.html
      - name: chemistry-row
        file: templates/chemistry-row.html
      - name: events
        file: templates/events.html
      - name: events-row
        file: templates/events-row.html
