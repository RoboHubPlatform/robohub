module:
  name: docsite
  id: robohub.app.docsite
  previous_ids:
    - robohub.applications.docsite
  type: rho
  version: 0.3.9
  author: Aurel Miron
  maintainer: Aurel Miron
  license: "MIT"
description: Serves the RoboHub documentation as a site — an index, a menu, the pages, and the ecosystem's release notes
main: src/main.rho

build:
  language: go
  targets:
    - go

deps:
  rho-doc: ">=0.1.0"

docs:
  title: The RoboHub documentation site
  section: applications
  order: "20"
  index: docs/doc/index.md
  sources:
    - docs/doc/index.md

hardware:
  targets: targets/

# Requirements: the prefix of the ids the documentation site allocates, and the
# repository that holds the levels and the system requirements (rho req).
requirements:
  prefix: SITE
  parent: robohub
