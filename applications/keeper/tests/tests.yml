# The keeper's test suites.
#
# A suite is declared rather than discovered: the Rho unit tests check the
# registry's string helpers, and the smoke suite builds and walks the
# applications page over HTTP.

name: keeper
suites:
  - name: tests/apps_test.rho
    kind: rho
    tags: [unit, rho]
  - name: apps-smoke
    kind: command
    tags: [smoke]
    command: [python3, tests/apps_smoke.py]
