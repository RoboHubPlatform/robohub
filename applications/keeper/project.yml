# What the keeper go-server target has that the toolchain's built-in one does
# not. The files, the kind, the router and the output folders are the built-in
# target's.

targets:
  - id: go-server
    # The documentation-store port renders the pages, through the generator the
    # rest of the toolchain documents with, so a page served here and a page a
    # build writes are the same page.
    ports:
      - docstore
      - logemit
    api:
      public_paths: "/, /modules, /applications, /plugins, /providers, /app-modules, /auth/login, /docs"
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: keeper
          cookie: keeper_session
          public_key: ~/.rho/auth/public.pem
          mode: direct
          login_url: "/auth/login?audience=keeper"
          session_file: ~/.rho/keeper/auth-sessions.txt
          skip_paths: /auth/login,/auth/service-token,/api/enroll,/api/nodes/verify,/i18n,/healthz,/assets,/assets/,/static
          scheme: auto
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
    # Every file under templates/ is a template, named by its file name.
    templates:
      - dir: templates
