version: 1

output_dir: build/generated
build_dir: build

targets:
  - id: go-server
    emitter: go
    kind: server
    description: RoboHub keeper HTTP service
    router: serveMux
    # The documentation-store port renders the pages, through the generator the
    # rest of the toolchain documents with, so a page served here and a page a
    # build writes are the same page.
    ports:
      - docstore
      - logemit
    api:
      public_paths: "/, /modules, /applications, /plugins, /providers, /app-modules, /auth/login, /docs"
    middleware:
      - name: auth
        options:
          issuer: keeper
          audience: keeper
          cookie: keeper_session
          public_key: ${RHO_HOME}/auth/public.pem
          mode: direct
          login_url: "/auth/login?audience=keeper"
          session_file: ~/.rho/keeper/auth-sessions.txt
          skip_paths: /auth/login,/healthz,/static
          scheme: auto
    templates:
      - name: layout
        file: templates/layout.html
      - name: home
        file: templates/home.html
      - name: modules
        file: templates/modules.html
      - name: docs
        file: templates/docs.html
      - name: module-detail
        file: templates/module-detail.html
      - name: module-row
        file: templates/module-row.html
      - name: applications
        file: templates/applications.html
      - name: application-row
        file: templates/application-row.html
      - name: app-actions
        file: templates/app-actions.html
      - name: notice
        file: templates/notice.html
      - name: status
        file: templates/status.html
      - name: plugins
        file: templates/plugins.html
      - name: plugin-row
        file: templates/plugin-row.html
      - name: plugin-actions
        file: templates/plugin-actions.html
      - name: providers
        file: templates/providers.html
      - name: provider-row
        file: templates/provider-row.html
      - name: provider-actions
        file: templates/provider-actions.html
      - name: app-modules
        file: templates/app-modules.html
      - name: app-module-row
        file: templates/app-module-row.html
      - name: app-module-actions
        file: templates/app-module-actions.html
      - name: auth-login
        file: templates/auth-login.html
      - name: auth-token
        file: templates/auth-token.html
      - name: auth-token-block
        file: templates/auth-token-block.html
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
