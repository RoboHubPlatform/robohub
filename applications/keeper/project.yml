version: 1

output_dir: build/generated
build_dir: build

targets:
  - id: go-server
    emitter: go
    kind: server
    description: RoboHub keeper HTTP service
    router: serveMux
    # The documentation-store port renders the pages, through the generator the
    # rest of the toolchain documents with, so a page served here and a page a
    # build writes are the same page.
    ports:
      - docstore
      - logemit
    api:
      public_paths: "/, /modules, /wizard"
    templates:
      - name: layout
        file: templates/layout.html
      - name: home
        file: templates/home.html
      - name: modules
        file: templates/modules.html
      - name: docs
        file: templates/docs.html
      - name: module-detail
        file: templates/module-detail.html
      - name: module-row
        file: templates/module-row.html
      - name: mesh
        file: templates/mesh.html
      - name: mesh-dashboard
        file: templates/mesh-dashboard.html
      - name: mesh-build
        file: templates/mesh-build.html
      - name: mesh-network
        file: templates/mesh-network.html
      - name: mesh-project-settings
        file: templates/mesh-project-settings.html
      - name: wizard
        file: templates/wizard.html
      - name: wizard-step
        file: templates/wizard-step.html
    files:
      - path: app.go
        role: implementation
      - path: runtime.go
        role: runtime
      - path: server.go
        role: server
      - path: main.go
        role: entrypoint
      - path: go.mod
        role: build
      - path: static
        kind: dir
