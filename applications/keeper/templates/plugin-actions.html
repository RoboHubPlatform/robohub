{{#if enabled}}<form method="post" action="/plugins/toggle"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="enabled" value="0"><button type="submit" class="quiet">Disable</button></form>{{else}}<form method="post" action="/plugins/toggle"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="enabled" value="1"><button type="submit">Enable</button></form>{{/if}} <form method="post" action="/plugins/test"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">Send test</button></form> <form method="post" action="/plugins/uninstall" onsubmit="return confirm('Remove this plugin from the tree?');"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="danger">Uninstall</button></form>
