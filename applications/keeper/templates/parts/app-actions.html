{{{ open }}}
{{#unless is_keeper}}
  {{#if running}}
  <form method="post" action="/applications/stop" hx-post="/applications/stop" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">Stop</button></form>
  <form method="post" action="/applications/restart" hx-post="/applications/restart" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet">Restart</button></form>
  {{/if}}
  {{#unless running}}
  <form method="post" action="/applications/start" hx-post="/applications/start" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit">Start</button></form>
  {{/unless}}
  <form method="post" action="/applications/build" hx-post="/applications/build" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet" title="Build from the sources; what runs is not touched">Build</button></form>
  <form method="post" action="/applications/redeploy" hx-post="/applications/redeploy" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><button type="submit" class="quiet" title="Build, write the service for where it is now, and restart" hx-confirm="Build {{ name }}, deploy it and restart it?">Redeploy</button></form>
{{/unless}}
{{#if pinned}}
<form method="post" action="/applications/menu" hx-post="/applications/menu" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="pinned" value="0"><button type="submit" class="quiet">Remove from menu</button></form>
{{/if}}
{{#unless pinned}}
<form method="post" action="/applications/menu" hx-post="/applications/menu" hx-target="closest tr" hx-swap="outerHTML"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="pinned" value="1"><button type="submit" class="quiet">Add to menu</button></form>
{{/unless}}
{{#unless is_keeper}}
<form method="post" action="/applications/uninstall" hx-post="/applications/uninstall" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="Remove this application from the keeper?"><input type="hidden" name="name" value="{{ name }}"><input type="hidden" name="origin" value="{{ origin }}"><button type="submit" class="danger" title="{{ hint }}">Uninstall</button></form>
{{/unless}}
