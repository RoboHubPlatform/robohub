module:
  name: keeper
  id: robohub.app.keeper
  previous_ids:
    - robohub.applications.keeper
  type: rho
  kind: keeper
  title: RoboHub Keeper
  route: /
  port: "8080"
  command: keeper
  version: 0.5.7
  author: Aurel Miron
  maintainer: Aurel Miron
description: A local dashboard for the RoboHub ecosystem — its registry, what is installed, and what it needs
main: src/main.rho

build:
  language: go
  targets:
    - go-server

# The application's own files, embedded when it is built.
assets:
  - module.yml
  - scripts/deploy-app.sh

deps:
  rho-log: ">=0.1.2"
  robohub:
    htmx: ">=0.1.0"
    i18n: ">=0.1.0"
    settings: ">=0.1.0"
    logging: ">=0.1.0"
    forms: ">=0.1.0"
    alert-dispatcher: ">=0.1.0"
    alert-log: ">=0.1.0"
    email-alert: ">=0.1.0"
    telegram-notifier: ">=0.1.0"
    robohub-contract-alert: ">=0.1.0"

# The keeper is the application a person is already looking at, and the one
# that runs the others. The block is what makes it the first row of its own
# registry and what stops that registry offering to remove it.

# The alert channels this application uses. The dispatcher is the one alert
# plugin the application calls; it fans out to the channels named in targets.
plugins:
  - name: alert-dispatcher
    enabled: true
    config:
      targets: "alert-log,email-alert,telegram-notifier"
      severity_threshold: INFO
  - name: alert-log
    enabled: true
    config:
      path: "~/.rho/keeper/alerts.log"
      severity_threshold: INFO
  - name: email-alert
    enabled: false
    config:
      provider: local
      from_address: "alerts@robohub.internal"
      to_address: "ops@robohub.internal"
      subject_template: "[RoboHub {app}] {level}: {rule}"
      body_template: "{message}"
      severity_threshold: ERROR
  - name: telegram-notifier
    enabled: false
    config:
      bot_token: ""
      chat_id: ""
      severity_threshold: WARNING

deploy:
  port: 19090
  service: robohub-keeper

docs:
  title: The RoboHub keeper
  section: applications
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md
