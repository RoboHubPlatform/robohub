#
# mesh-gateway — the RoboHub Mesh gateway provider.
#
# An application that needs a mesh asks the gateway contract for projects,
# sources and states; this plugin is the provider that knows those answers are
# under Mesh's /mesh/api. A different mesh is another plugin with the same
# `plugin.kind: gateway` and its own transport.
#
module:
  name: mesh-gateway
  id: robohub.plugins.mesh-gateway
  type: module
  plugin_kind: gateway
  plugin_provider: robohub-provider-mesh
  plugin_transport: mesh
  version: 0.2.1
  description: Serves a RoboHub Mesh project's projects, sources, gateway state and telemetry to an application.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-04"

main: src/main.rho


metadata:
  tags:
    - plugin
    - gateway
    - mesh

docs:
  title: mesh-gateway
  section: plugins
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md
