#
# robohub-auth — the SSO plugin applications name to use rho-auth.
#
module:
  name: robohub-auth
  id: robohub.module.auth
  previous_ids:
    - robohub.plugins.robohub-auth
  type: module
  plugin_kind: auth
  plugin_provider: rho-auth
  plugin_transport: keeper
  version: 0.1.0
  description: Wires an application into rho-auth SSO through the Keeper.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-04"

main: src/main.rho


metadata:
  tags:
    - plugin
    - auth
    - sso

docs:
  title: robohub-auth
  section: plugins
  order: "40"
  index: docs/doc/index.md
  sources:
    - docs/doc/index.md

# Requirements: the prefix of the ids this module allocates, and the repository
# that holds levels.yml and the system level (rho req).
requirements:
  prefix: AUTHP
  parent: robohub
