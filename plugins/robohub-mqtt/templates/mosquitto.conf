# Written by the RoboHub keeper for robohub-mqtt; it is written again whenever a
# broker user, a topic rule or a listener changes, and edits here are lost.
per_listener_settings false
allow_anonymous false
password_file {password_file}
acl_file {acl_file}
persistence true
persistence_location {data}/
log_dest stdout
log_type error
log_type warning
# The keeper asks whether the broker answers by opening and closing a connection;
# a line for each would bury everything else.
connection_messages false
listener {port} {listen}
