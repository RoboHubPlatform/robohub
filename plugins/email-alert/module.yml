#
# email-alert — e-mail notifications through a provider.
#
# `local` writes the rendered message to ~/.rho/plugins/email-outbox.eml and is
# the default, so a development machine with no mail server can still see what
# would have been sent. `smtp` uploads the same message with curl. A template
# names the level, message, metadata and application.
#
module:
  name: email-alert
  id: robohub.module.email-alert
  previous_ids:
    - robohub.plugins.email-alert
  type: module
  plugin_kind: alert
  plugin_provider: local
  plugin_transport: email
  version: 0.1.0
  description: Sends an alert by e-mail through SMTP or a local outbox.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-11-02"

main: src/main.rho


metadata:
  tags:
    - plugin
    - alert
    - email
    - smtp

docs:
  title: email-alert
  section: plugins
  order: "30"
  index: docs/index.md
  sources:
    - docs/index.md
