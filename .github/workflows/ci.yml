# CI for this repository: the RoboHub workflow every repository in the
# ecosystem calls, so the steps are written once (robohub/.github/workflows).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/robohub-ci.yml
    secrets: inherit
    with:
      # The orchestrator's tests check the ecosystem is whole: every repository
      # its registry names is checked out beside it.
      siblings: >-
        robohub-aquarium robohub-avr robohub-common robohub-devices
        robohub-drivers robohub-energy robohub-esp32 robohub-feed robohub-gateway
        robohub-keeper robohub-linux robohub-mesh robohub-node robohub-pico
        robohub-stm32
      components: rho-auth rho-log rho-sql rho-sql-sqlite rho-doc rho-doc-api rho-doc-toc rho-robohub
      # The orchestrator itself first: its tests run ./build/robohub.
      build: . applications/*
